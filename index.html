<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MQTT Chat — voice &amp; text</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header>
    <div class="titlebar">
      <h1>📡 MQTT Chat</h1>
      <div class="status"><span id="dot" class="dot"></span><span id="statusText">Disconnected</span></div>
      <button id="logBtn" class="ghost small" title="Show/hide debug log">🐞 Logs</button>
    </div>
    <div class="setup">
      <input id="nick" class="field" placeholder="Your name" maxlength="24" />
      <input id="room" class="field" placeholder="Room name" value="lobby" maxlength="40" />
      <button id="connectBtn">Connect</button>
    </div>
  </header>

  <div class="hint">
    Broker: <b>broker.hivemq.com</b> (public &amp; free). Everyone in the same room can read messages — it's a public broker, so don't send secrets.
  </div>

  <!-- Group voice call status bar (hidden until you join a call) -->
  <div id="callBar" class="callbar">
    <span id="callInfo">🔊 In call</span>
    <span id="callPeers" class="peers"></span>
    <button id="soundBtn" class="warn small" style="display:none">🔊 Enable sound</button>
    <button id="muteBtn" class="ghost small">🎙️ Mute</button>
    <button id="leaveCallBtn" class="danger small">Leave call</button>
  </div>

  <!-- Live audio waveforms (mic + each peer), visible during a call -->
  <div id="waveforms" class="waveforms"></div>

  <div id="messages"></div>

  <footer>
    <input id="text" placeholder="Type a message… (Enter to send)" disabled />
    <button id="sendBtn" disabled>Send</button>
    <button id="voiceBtn" class="ghost" disabled title="Click to start/stop recording">🎤 Voice</button>
    <button id="callBtn" class="ghost" disabled title="Join the group voice call">📞 Join call</button>
    <span id="recbar" class="recbar">● Recording <span id="recTime">0s</span></span>
  </footer>

  <!-- Remote call audio streams are attached here (not visible) -->
  <div id="audioSink" style="display:none"></div>

  <!-- Debug log drawer -->
  <div id="debugPanel" class="debug">
    <div class="debug-head">
      <span>🐞 Debug log</span>
      <span class="debug-actions">
        <button id="clearLogBtn" class="ghost small">Clear</button>
        <button id="closeLogBtn" class="ghost small">Hide</button>
      </span>
    </div>
    <div id="debugLog" class="debug-log"></div>
  </div>

  <!-- MQTT over WebSockets client -->
  <script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>

  <!-- App modules (load order matters) -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/debug.js"></script>
  <script src="assets/js/viz.js"></script>
  <script src="assets/js/mqtt-client.js"></script>
  <script src="assets/js/voice.js"></script>
  <script src="assets/js/call.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
